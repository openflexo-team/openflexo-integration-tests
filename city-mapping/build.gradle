// CityMapping - federating two heterogeneous EMF city metamodels through a mapping viewpoint,
// projected on diagrams.
//
// Self-contained use-case project: it carries BOTH its resource center (src/main/resources,
// declared by META-INF/resourceCenters with base URI http://openflexo.org/city-mapping) AND the
// tests that exercise it (src/test/java). No separate -rc project.
//
// The CityMapping / CityViews viewpoints keep their own URIs (http://www.thalesgroup.com/...),
// independent of the resource center: only the EMF models are addressed through the RC base URI.
//
// Two test surfaces coexist on purpose: the JUnit classes of src/test/java, which reach the
// federation through the Java action API and are the only ones able to assert on binding models
// and on the shape of a control graph, and the FML-scripts of src/main/resources/AutomatedTests,
// which drive the very same Mapping VirtualModel through the FML runtime and assert on business
// values. The latter is why fml-cli is a test dependency here.

dependencies {
    testImplementation testUtils()
    testImplementation flexoFoundation()
    testImplementation flexoFoundationTest()
    testImplementation fmlCli()
    testImplementation fmlCliTest()
    testImplementation emfConnector()
    testImplementation diagramConnector()
}
